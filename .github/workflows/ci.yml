name: ci
on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python syntax (all hooks + scripts)
        run: python3 -m py_compile plugins/smartuse/hooks/bash-guard.py plugins/smartuse/hooks/file-guard.py plugins/smartuse/hooks/ledger.py plugins/smartuse/hooks/until-done.py plugins/smartuse/hooks/heartbeat.py scripts/term-scan.py bench/ab-report.py
      - name: JSON manifests parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('plugins/smartuse/.claude-plugin/plugin.json')); json.load(open('plugins/smartuse/hooks/hooks.json'))"
      - name: Shell syntax
        run: for f in plugins/smartuse/hooks/py.sh plugins/smartuse/hooks/tests/*.sh bench/run.sh bench/ab.sh bench/fake-claude.sh bench/tests/ab-test.sh; do bash -n "$f"; done
      - name: bash-guard regression
        run: bash plugins/smartuse/hooks/tests/run.sh
      - name: file-guard regression
        run: bash plugins/smartuse/hooks/tests/file-guard-test.sh
      - name: ledger + receipts regression
        run: bash plugins/smartuse/hooks/tests/ledger-test.sh
      - name: until-done gate regression
        run: bash plugins/smartuse/hooks/tests/until-done-test.sh
      - name: heartbeat regression
        run: bash plugins/smartuse/hooks/tests/heartbeat-test.sh
      - name: A/B runner dry run (fake claude, spends nothing)
        run: bash bench/tests/ab-test.sh
      - name: term scan (generic patterns; the private list is never in the repo)
        run: python3 scripts/term-scan.py || echo "::warning::term-scan found hits — see the job log"
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Validate plugin and marketplace (strict)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate --strict plugins/smartuse
          claude plugin validate --strict .
