name: evals
# claude plugin eval over every case in plugins/smartuse/evals/, on Linux (the Windows laptop has no sandbox backend for a
# Bash grant). Auth: the repo secret CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (subscription usage, no API bill).
# Without the secret the job says so and passes; it never reports a score it did not run.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'plugins/smartuse/skills/**'
      - 'plugins/smartuse/evals/**'
      - 'plugins/smartuse/hooks/**'
      - '.github/workflows/evals.yml'
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Token present?
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — evals not run, nothing scored"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Sandbox backend (bubblewrap + socat; Ubuntu 24.04 AppArmor allows user namespaces on this throwaway runner)
        if: steps.token.outputs.ok == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Install Claude Code
        if: steps.token.outputs.ok == '1'
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: claude plugin eval (all cases, one arm, cost cap)
        if: steps.token.outputs.ok == '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # this step only
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          unset ANTHROPIC_API_KEY   # it would outrank the subscription token
          export TMPDIR="$RUNNER_TEMP/evaltmp"; mkdir -p "$TMPDIR"   # the eval sandbox denies /tmp
          claude --version
          claude plugin eval plugins/smartuse --trust-plugin --scaffold --ablation none \
            --allow-tools Bash Skill Read Grep Glob Agent Write \
            --max-cost-usd 3 --no-publish --output-dir "$RUNNER_TEMP/eval-out"
      - name: Leak check (the agent under test has Bash; the artifact is public)
        id: leak
        if: always() && steps.token.outputs.ok == '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -d "$RUNNER_TEMP/eval-out" ] && grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$RUNNER_TEMP/eval-out"; then
            rm -rf "$RUNNER_TEMP/eval-out"; echo "::error::the token appears in the eval output — not uploaded; revoke and re-issue it"; exit 1
          fi
          echo "clean=1" >> "$GITHUB_OUTPUT"
      - name: Upload results
        if: always() && steps.leak.outputs.clean == '1'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-out/aggregate-result.json
          if-no-files-found: warn
          retention-days: 3
